name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j4
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: XOR demo
        run: ./build/xor_demo
      - name: Spiral demo
        run: ./build/spiral_demo
      - name: CNN demo
        run: ./build/cnn_demo
      - name: Benchmark smoke test
        run: ./build/benchmark
      - name: Download MNIST
        run: ./scripts/download_mnist.sh
      - name: MNIST demo
        run: ./build/mnist_demo
      - name: MNIST CNN demo (quick smoke)
        run: MNIST_CNN_QUICK=1 ./build/mnist_cnn
